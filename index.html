<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vistoria QSMS · Construtora Axial</title>
<meta name="description" content="Vistoria simplificada de obras — DDS, visitas e ocorrências de SST da Construtora Axial">
<meta name="theme-color" content="#155F8F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --azul:#1B7BB8; --azul-claro:#4BA3D3; --azul-escuro:#155F8F; --navy:#12324F;
  --azul-bg:#e8f2fa;
  --texto:#1f2a33; --suave:#5c6873; --borda:#d8dee4; --fundo:#f1f4f7; --card:#fff;
  --verde:#2e9e5b; --verde-bg:#e6f5ec;
  --vermelho:#cf3b3b; --vermelho-bg:#fdeaea;
  --amarelo:#b98200; --amarelo-bg:#fdf5e1;
  --raio:14px;
  --sombra:0 1px 2px rgba(16,40,60,.06),0 4px 14px rgba(16,40,60,.07);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--fundo);color:var(--texto);
  font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{line-height:1.2;margin:0}
a{color:var(--azul-escuro)}
.ico{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}

/* --------- estrutura */
.topo{position:sticky;top:0;z-index:20;background:var(--azul-escuro);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.topo .titulo{flex:1;min-width:0}
.topo .titulo b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo .titulo small{opacity:.8;font-size:13px}
.topo button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:8px 10px;display:inline-flex;gap:6px;align-items:center;cursor:pointer;font-size:14px}
.topo button:hover{background:rgba(255,255,255,.24)}
.pagina{max-width:720px;margin:0 auto;padding:16px 16px 48px}
.pagina.larga{max-width:1180px}
.demo{background:var(--amarelo-bg);color:#6b4b00;font-size:13px;padding:8px 16px;text-align:center;border-bottom:1px solid #f0dca6}

/* --------- botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;
  background:var(--azul);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;min-height:48px}
.btn:hover{background:var(--azul-escuro)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.sec{background:#fff;color:var(--azul-escuro);border:1.5px solid var(--borda)}
.btn.sec:hover{border-color:var(--azul-claro);background:var(--azul-bg)}
.btn.perigo{background:var(--vermelho)}
.btn.verde{background:var(--verde)}
.btn.bloco{width:100%}
.btn.peq{min-height:38px;padding:8px 12px;font-size:14px;border-radius:10px}
.link{background:none;border:0;color:var(--azul-escuro);text-decoration:underline;cursor:pointer;padding:4px}
.linha-btns{display:flex;gap:10px;flex-wrap:wrap}
.linha-btns>.btn{flex:1 1 auto}

/* --------- tela inicial */
.inicio{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;
  background:linear-gradient(180deg,#fff 0%,#eef5fb 60%,#dfeaf4 100%)}
.inicio img.logo{width:min(320px,80vw);height:auto;mix-blend-mode:multiply}
.inicio h1{font-size:26px;color:var(--navy);margin-top:16px;text-align:center}
.inicio p.sub{color:var(--suave);margin:6px 0 28px;text-align:center}
.escolha{display:grid;gap:14px;width:100%;max-width:420px}
.escolha button{display:flex;align-items:center;gap:16px;text-align:left;border:0;border-radius:18px;padding:20px;cursor:pointer;
  background:#fff;box-shadow:var(--sombra);border:2px solid transparent;transition:border-color .15s,transform .1s}
.escolha button:hover{border-color:var(--azul-claro)}
.escolha button:active{transform:scale(.99)}
.escolha .bolha{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;flex:none}
.escolha .bolha .ico{width:30px;height:30px}
.escolha b{display:block;font-size:19px;color:var(--navy)}
.escolha small{color:var(--suave);font-size:14px}
.versao{color:var(--suave);font-size:12px;margin-top:28px;text-align:center}

/* --------- cartões e formulários */
.card{background:var(--card);border-radius:var(--raio);box-shadow:var(--sombra);padding:18px;margin-bottom:14px}
.card h2{font-size:18px;color:var(--navy);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3{font-size:15px;color:var(--navy);margin:0 0 8px}
.campo{margin-bottom:14px}
.campo:last-child{margin-bottom:0}
.campo>label,.rotulo{display:block;font-weight:600;font-size:14px;margin-bottom:6px;color:#34414c}
.campo .dica{font-size:13px;color:var(--suave);margin-top:4px}
.req::after{content:" *";color:var(--vermelho)}
input[type=text],input[type=number],input[type=password],input[type=search],select,textarea{
  width:100%;border:1.5px solid var(--borda);border-radius:10px;padding:11px 12px;background:#fff;min-height:46px;font-size:16px}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 3px rgba(27,123,184,.15)}
.erro-campo{border-color:var(--vermelho)!important;background:#fffafa}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.duas{grid-template-columns:1fr}}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;padding:9px 13px;border-radius:999px;border:1.5px solid var(--borda);background:#fff;cursor:pointer;font-size:14px;user-select:none}
.chip input:checked+span{background:var(--azul);border-color:var(--azul);color:#fff}
.chip input:focus-visible+span{box-shadow:0 0 0 3px rgba(27,123,184,.25)}

.opcoes-grandes{display:grid;gap:10px}
.opcao{position:relative;display:block}
.opcao input{position:absolute;opacity:0;pointer-events:none}
.opcao .caixa{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--borda);border-radius:12px;padding:12px 14px;background:#fff;cursor:pointer}
.opcao .caixa::before{content:"";width:20px;height:20px;border-radius:50%;border:2px solid #9aa7b3;flex:none;margin-top:2px}
.opcao input:checked+.caixa{border-color:var(--cor,var(--azul));background:var(--cor-bg,var(--azul-bg))}
.opcao input:checked+.caixa::before{border-color:var(--cor,var(--azul));background:radial-gradient(var(--cor,var(--azul)) 45%,transparent 50%)}
.opcao b{display:block}
.opcao small{color:var(--suave)}

/* checklist C / NC / NA */
.chk{border:1.5px solid var(--borda);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
.chk[data-s="C"]{border-color:#9fd4b3;background:#f6fcf8}
.chk[data-s="NC"]{border-color:#f0a8a8;background:#fff8f8}
.chk[data-s="NA"]{border-color:#cfd6dc;background:#fafbfc}
.chk-top{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.chk-top p{margin:0;font-size:15px}
.tag{font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;background:var(--azul-bg);color:var(--azul-escuro);flex:none;margin-top:2px}
.tag.EPC{background:#efe9fb;color:#5b3fa0}
.tag.Geral{background:#eef0f2;color:#4a5560}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{border:1.5px solid var(--borda);background:#fff;border-radius:10px;min-height:44px;font-weight:700;cursor:pointer}
.seg button small{display:block;font-weight:500;font-size:11px;color:var(--suave)}
.seg button.on[data-v="C"]{background:var(--verde);border-color:var(--verde);color:#fff}
.seg button.on[data-v="NC"]{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
.seg button.on[data-v="NA"]{background:#7d8a96;border-color:#7d8a96;color:#fff}
.seg button.on small{color:inherit;opacity:.9}
.nc-box{margin-top:12px;padding-top:12px;border-top:1px dashed #f0a8a8}
.desvio{border:1.5px dashed #f0a8a8;border-radius:12px;padding:12px;margin-bottom:10px;background:#fffafa}

/* fotos */
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:10px}
.foto{position:relative;background:#fff;border:1px solid var(--borda);border-radius:10px;overflow:hidden}
.foto img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#e9eef2;cursor:zoom-in}
.foto input{border:0;border-top:1px solid var(--borda);border-radius:0;min-height:38px;font-size:13px;padding:8px}
.foto .tirar{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;display:grid;place-items:center}
.foto .tirar .ico{width:16px;height:16px}
.foto figcaption{font-size:13px;padding:6px 8px;color:var(--suave)}
.botoes-foto{display:flex;gap:10px}
.botoes-foto label{flex:1}

.gps{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--verde);margin-top:6px}
.gps.aviso{color:var(--amarelo)}
.alerta{border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start;font-size:14px}
.alerta .ico{margin-top:1px}
.alerta.vermelho{background:var(--vermelho-bg);color:#8a1f1f;border:1px solid #f3c2c2}
.alerta.amarelo{background:var(--amarelo-bg);color:#6b4b00;border:1px solid #f0dca6}
.alerta.azul{background:var(--azul-bg);color:var(--azul-escuro);border:1px solid #c7def0}

/* --------- técnico: início */
.ola{margin:6px 0 16px}
.ola h1{font-size:22px;color:var(--navy)}
.ola p{margin:4px 0 0;color:var(--suave)}
.acoes{display:grid;gap:14px}
.acao{display:flex;gap:16px;align-items:center;border:0;border-radius:18px;padding:20px;background:#fff;box-shadow:var(--sombra);cursor:pointer;text-align:left;border-left:6px solid var(--cor)}
.acao:active{transform:scale(.99)}
.acao .bolha{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;background:var(--cor-bg);color:var(--cor);flex:none}
.acao .bolha .ico{width:30px;height:30px}
.acao b{display:block;font-size:19px;color:var(--navy)}
.acao small{color:var(--suave);font-size:14px}
.enviados{margin-top:22px}
.enviados h3{font-size:14px;color:var(--suave);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.enviado{display:flex;gap:10px;align-items:center;background:#fff;border-radius:12px;padding:10px 14px;margin-bottom:8px;font-size:14px}
.enviado .ico{color:var(--verde);width:18px;height:18px}

.sucesso{text-align:center;padding:40px 16px}
.sucesso .bolha{width:88px;height:88px;border-radius:50%;background:var(--verde-bg);color:var(--verde);display:grid;place-items:center;margin:0 auto 18px}
.sucesso .bolha .ico{width:48px;height:48px}
.sucesso h1{color:var(--navy);font-size:24px}
.sucesso p{color:var(--suave)}
.sucesso .numero{font-size:40px;font-weight:800;color:var(--azul-escuro);margin:12px 0}

/* --------- admin */
.abas{display:flex;gap:6px;overflow-x:auto;margin:0 0 16px;padding-bottom:2px}
.abas button{border:0;background:#fff;border-radius:10px;padding:10px 16px;font-weight:600;color:var(--suave);cursor:pointer;white-space:nowrap;box-shadow:var(--sombra)}
.abas button.on{background:var(--azul-escuro);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border-radius:var(--raio);box-shadow:var(--sombra);padding:14px 16px}
.kpi small{display:block;color:var(--suave);font-size:13px}
.kpi b{font-size:28px;color:var(--navy)}
.kpi.vermelho b{color:var(--vermelho)}
.filtros{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin-bottom:10px}
@media (max-width:820px){.filtros{grid-template-columns:1fr 1fr}}
.filtros-tipo{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.lista-reg{display:grid;gap:10px}
.reg{display:flex;gap:14px;align-items:center;background:#fff;border-radius:12px;padding:12px 14px;box-shadow:var(--sombra);cursor:pointer;border-left:5px solid var(--cor);text-align:left;border-top:0;border-right:0;border-bottom:0;width:100%}
.reg:hover{background:#fbfdff}
.reg .bolha{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--cor-bg);color:var(--cor);flex:none}
.reg .meio{flex:1;min-width:0}
.reg .meio b{display:block;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reg .meio small{color:var(--suave);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reg .lado{text-align:right;font-size:13px;color:var(--suave);flex:none}
.selo{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.selo.novo{background:var(--azul);color:#fff}
.selo.em_analise{background:var(--amarelo-bg);color:#6b4b00}
.selo.concluido{background:var(--verde-bg);color:#1d6b3d}
.selo.vermelho{background:var(--vermelho-bg);color:#8a1f1f}
.selo.cinza{background:#eef0f2;color:#4a5560}
.vazio{text-align:center;color:var(--suave);padding:30px}

.det-cab{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.det-cab h1{font-size:22px;color:var(--navy);flex:1;min-width:220px}
.grade-dados{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 18px}
.dado small{display:block;color:var(--suave);font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.dado div{white-space:pre-wrap}
.tabela{width:100%;border-collapse:collapse;font-size:14px}
.tabela th,.tabela td{border:1px solid var(--borda);padding:8px;text-align:left;vertical-align:top}
.tabela th{background:#f4f7fa;font-size:13px}
.st{font-weight:800;text-align:center!important;width:52px}
.st.C{color:var(--verde)} .st.NC{color:var(--vermelho);background:#fff6f6} .st.NA{color:#7d8a96}
.lado-a-lado{display:grid;grid-template-columns:2fr 1fr;gap:14px;align-items:start}
@media (max-width:900px){.lado-a-lado{grid-template-columns:1fr}}
.historico{font-size:13px;color:var(--suave);margin:0;padding-left:18px}
.usuario{display:flex;gap:12px;align-items:center;background:#fff;border-radius:12px;padding:12px 14px;box-shadow:var(--sombra);margin-bottom:10px;cursor:pointer;width:100%;border:0;text-align:left}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--azul-bg);color:var(--azul-escuro);display:grid;place-items:center;font-weight:800;flex:none}
.item-lista{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.item-lista input[type=text]{flex:1}
.item-lista select{width:100px;flex:none}
.item-lista .liga{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--suave);flex:none}
.item-lista.inativo input[type=text]{color:#9aa7b3;text-decoration:line-through}

/* modal, toast, lightbox */
.fundo-modal{position:fixed;inset:0;background:rgba(10,25,40,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:640px){.fundo-modal{align-items:center}}
.modal{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media (min-width:640px){.modal{border-radius:18px}}
.modal h2{font-size:19px;color:var(--navy);margin-bottom:14px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:60;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:16px}
.lightbox img{max-width:100%;max-height:84vh;object-fit:contain}
.lightbox p{color:#fff;margin-top:10px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:70;display:grid;gap:8px;width:min(92vw,460px)}
.t{background:#1f2a33;color:#fff;border-radius:12px;padding:12px 16px;box-shadow:0 6px 24px rgba(0,0,0,.25);font-size:15px;display:flex;gap:10px;align-items:center}
.t.erro{background:#8a1f1f}
.t.ok{background:#1d6b3d}
.t button{margin-left:auto;background:#fff;color:#1f2a33;border:0;border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer}
.carregando{display:grid;place-items:center;min-height:60vh;color:var(--suave)}
.giro{width:34px;height:34px;border:4px solid #cfe1ef;border-top-color:var(--azul);border-radius:50%;animation:giro 1s linear infinite;margin:0 auto 10px}
@keyframes giro{to{transform:rotate(360deg)}}

/* --------- impressão (PDF) */
.so-impressao{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;font-size:11pt}
  .topo,.demo,.nao-imprimir,.abas,#toast{display:none!important}
  .so-impressao{display:block}
  .pagina{max-width:none;padding:0}
  .card{box-shadow:none;border:1px solid #c9d2da;break-inside:avoid;padding:10px 12px;margin-bottom:8px;border-radius:6px}
  .lado-a-lado{display:block}
  .fotos{grid-template-columns:1fr 1fr}
  .foto{break-inside:avoid}
  .foto img{aspect-ratio:auto;max-height:80mm;object-fit:contain}
  .tabela th,.tabela td{padding:4px 6px}
  .cab-impressao{display:flex;align-items:center;gap:14px;border-bottom:3px solid var(--azul);padding-bottom:8px;margin-bottom:10px}
  .cab-impressao img{height:46px}
  .cab-impressao b{font-size:14pt;color:var(--navy)}
  .assinaturas{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:40px}
  .assinaturas div{border-top:1px solid #333;padding-top:4px;font-size:10pt;text-align:center}
}
</style>
</head>
<body>
<div id="app"><div class="carregando"><div><div class="giro"></div>Carregando…</div></div></div>
<div id="toast"></div>
<div id="camada"></div>

<script>
// ============================================================
//  VISTORIA QSMS — Construtora Axial
//  Ao publicar mudança: suba APP_VERSION aqui E a VERSION no sw.js
//  (o GitHub confere — workflow "Conferir versão").
// ============================================================
const APP_VERSION = 'v1.0.0';
const SUPABASE_URL = 'COLE_AQUI_A_URL_DO_SUPABASE';        // ex.: https://abcd1234.supabase.co
const SUPABASE_KEY = 'COLE_AQUI_A_PUBLISHABLE_KEY';         // sb_publishable_...  (NUNCA a sb_secret_)
const DOMINIO_USUARIO = 'vistoria-qsms.app';               // igual ao da Edge Function
const FUSO = 'America/Sao_Paulo';

// Sem Supabase configurado → MODO DEMONSTRAÇÃO (dados só neste aparelho).
const DEMO = /COLE_AQUI/.test(SUPABASE_URL + SUPABASE_KEY);

// ------------------------------------------------------------ ícones
const IC = {
  dds:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',

function toast(msg, ms = 3800, tipo = '', botao = null) {
  const t = document.createElement('div');
  t.className = 't ' + tipo;
  t.innerHTML = `<span>${esc(msg)}</span>`;
  if (botao) {
    const b = document.createElement('button');
    b.textContent = botao.texto; b.onclick = () => { t.remove(); botao.acao(); };
    t.appendChild(b);
  }
  $('#toast').appendChild(t);
  if (ms) setTimeout(() => t.remove(), ms);
}

// Data/hora — SÓ usado nas telas do administrador.
function fmtDataHora(iso) {
  return new Date(iso).toLocaleString('pt-BR', { timeZone: FUSO, day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function fmtData(iso) { return new Date(iso).toLocaleDateString('pt-BR', { timeZone: FUSO }); }
function fmtHora(iso) { return new Date(iso).toLocaleTimeString('pt-BR', { timeZone: FUSO, hour: '2-digit', minute: '2-digit' }); }
// Prazo da CAT (Lei 8.213/91, art. 22): até o 1º dia útil seguinte; óbito = imediato.
function prazoCAT(iso) {
  const [d, m, a] = fmtData(iso).split('/').map(Number);
  const dt = new Date(Date.UTC(a, m - 1, d, 12));
  do { dt.setUTCDate(dt.getUTCDate() + 1); } while ([0, 6].includes(dt.getUTCDay()));
  return dt.toLocaleDateString('pt-BR', { timeZone: 'UTC' });
}

async function comprimirImagem(file, max = DEMO ? 1000 : 1600, qualidade = DEMO ? 0.6 : 0.72) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, falha) => {
      const i = new Image();
      i.onload = () => ok(i);
      i.onerror = () => falha(new Error('Não consegui abrir esta imagem. Tente tirar a foto pelo botão "Tirar foto".'));
      i.src = url;
    });
    let w = img.naturalWidth, h = img.naturalHeight;
    const k = Math.min(1, max / Math.max(w, h));
    w = Math.round(w * k); h = Math.round(h * k);
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    return await new Promise((ok) => c.toBlob(ok, 'image/jpeg', qualidade));
  } finally { URL.revokeObjectURL(url); }
}
const blobParaDataURL = (b) => new Promise((ok) => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(b); });

function traduzErro(e) {
  const m = String(e?.message || e || '');
  if (/invalid login credentials/i.test(m)) return 'Usuário ou senha incorretos.';
  if (/banned|user is banned/i.test(m)) return 'Este acesso está bloqueado. Fale com a engenheira.';
  if (/failed to fetch|networkerror|load failed/i.test(m)) return 'Sem conexão com a internet. Confira o sinal e tente de novo.';
  if (/jwt|session/i.test(m)) return 'Sua sessão expirou. Entre novamente.';
  return m || 'Erro inesperado.';
}

      if (String(c.senha || '').length < 8) throw new Error('A senha precisa ter pelo menos 8 caracteres.');
      if (this.d.usuarios.some((x) => x.email === email)) throw new Error('Já existe um usuário com este login.');
      this.d.usuarios.push({ id: novoId(), nome: c.nome, email, senha: c.senha, papel: c.papel === 'admin' ? 'admin' : 'tecnico', funcao: c.funcao || '', registro: c.registro || '', ativo: true });
    } else if (!u) throw new Error('Usuário não encontrado.');
    else if (c.acao === 'editar') Object.assign(u, { nome: c.nome, papel: c.papel, funcao: c.funcao, registro: c.registro });
    else if (c.acao === 'senha') { if (String(c.senha || '').length < 8) throw new Error('A senha precisa ter pelo menos 8 caracteres.'); u.senha = c.senha; }
    else if (c.acao === 'bloquear') { if (u.id === this.d.sessao) throw new Error('Você não pode bloquear a si mesma.'); u.ativo = false; }
    else if (c.acao === 'reativar') u.ativo = true;
    this.gravar();
    return { ok: true };
  },
  async salvarLinha(tabela, linha) {
    const lista = tabela === 'opcoes' ? this.d.opcoes : this.d.checklist;
    if (linha.id) Object.assign(lista.find((x) => x.id === linha.id), linha);
    else lista.push({ id: novoId(), ativo: true, ...linha });
    this.gravar();
  },
  apagarTudo() { Object.keys(localStorage).filter((k) => k.startsWith('vq_demo')).forEach((k) => localStorage.removeItem(k)); location.reload(); },
};

// Navegação com o botão "voltar" do celular.
let pilha = [];
function ir(tela, params = {}, substituir = false) {
  if (S.form?.sujo && !substituir && !confirm('Sair sem enviar? O que foi preenchido será perdido.')) return;
  if (!tela.startsWith('form')) S.form = null;
  const estado = { tela, params };
  if (substituir) { history.replaceState(estado, ''); pilha[pilha.length - 1] = estado; }
  else { history.pushState(estado, ''); pilha.push(estado); }
  desenhar(estado);
}
window.addEventListener('popstate', (e) => {
  if (S.form?.sujo) {
    if (!confirm('Sair sem enviar? O que foi preenchido será perdido.')) { history.pushState(pilha[pilha.length - 1], ''); return; }
  }
  pilha.pop();
  const estado = e.state || { tela: telaInicial(), params: {} };
  if (!estado.tela.startsWith('form')) S.form = null;
  desenhar(estado);
});
function voltar() { history.back(); }
function telaInicial() { return !S.perfil ? 'inicio' : (S.perfil.papel === 'admin' ? 'admin' : 'tecnico'); }

function desenhar({ tela, params }) {
  const telas = { inicio: telaInicio, login: telaLogin, tecnico: telaTecnico, form: telaForm, sucesso: telaSucesso, admin: telaAdmin, registro: telaRegistro, editar: telaEditar };
  // proteção de navegação (o banco também confere tudo)
  if (!S.perfil && !['inicio', 'login'].includes(tela)) tela = 'inicio';
  if (S.perfil && ['inicio', 'login'].includes(tela)) tela = telaInicial();
  if (['admin', 'registro', 'editar'].includes(tela) && S.perfil?.papel !== 'admin') tela = 'tecnico';
  window.scrollTo(0, 0);
  (telas[tela] || telaInicio)(params);
}

async function fazerLogin(ev, modo) {
  ev.preventDefault();
  const btn = $('#l-btn'), erro = $('#l-erro');
  btn.disabled = true; btn.textContent = 'Entrando…'; erro.hidden = true;
  try {
    const perfil = await api.entrar($('#l-login').value, $('#l-senha').value);
    if (!perfil || !perfil.ativo) { await api.sair(); throw new Error('Este acesso está bloqueado. Fale com a engenheira.'); }
    if (modo === 'admin' && perfil.papel !== 'admin') {
      await api.sair();
      throw new Error('Este usuário não tem acesso de administrador. Volte e entre como "Usuário".');
    }
    S.perfil = perfil;
    await carregarListas();
    const destino = { tela: modo === 'admin' ? 'admin' : 'tecnico', params: {} };
    history.replaceState(destino, '');
    pilha = [destino];
    desenhar(destino);
  } catch (e) {
    erro.textContent = traduzErro(e); erro.hidden = false;
    btn.disabled = false; btn.textContent = 'Entrar';
  }
}

async function esqueciSenha() {
  const email = ($('#l-login').value || '').trim();
  if (!email.includes('@')) { toast('Digite o seu e-mail no campo acima e toque de novo em "Esqueci minha senha".', 6000); return; }
  try { await api.esqueciSenha(email); toast('Se o e-mail estiver cadastrado, chegará um link para criar nova senha.', 7000, 'ok'); }
  catch (e) { toast(traduzErro(e), 6000, 'erro'); }
}

async function sair() {
  if (S.form?.sujo && !confirm('Sair sem enviar? O que foi preenchido será perdido.')) return;
  S.form = null;
  await api.sair().catch(() => {});
  S.perfil = null;
  pilha = [];
  history.replaceState({ tela: 'inicio', params: {} }, '');
  desenhar({ tela: 'inicio', params: {} });
}

async function carregarListas() {
  try { S.listas = await api.listas(); }
  catch (e) { toast('Não consegui carregar as listas: ' + traduzErro(e), 6000, 'erro'); }
}

function camposDesvio(x = {}, comDescricaoLivre = true) {

function blocoDesvio(x = {}) {

function addDesvio() { $('#desvios').insertAdjacentHTML('beforeend', blocoDesvio()); S.form.sujo = true; }
function marcarChk(i, v) {

function atualizarOcorrencia() {
  const c = $('input[name="classificacao"]:checked')?.value;
  const lesao = !!CLASSIF[c]?.lesao;
  $('#sec-lesao').hidden = !lesao;
  $('#aviso-cat').hidden = !lesao;
  $('#sec-dano').hidden = c !== 'sem_lesao';
}

// ---------- fotos
function blocoFotos(comLegenda = false) {
  S.form.comLegenda = comLegenda;
  return `<div class="fotos" id="fotos"></div>
    <div class="botoes-foto">
      <label class="btn sec"><input type="file" accept="image/*" capture="environment" hidden onchange="addFotos(this)">${ico('camera')} Tirar foto</label>
      <label class="btn sec"><input type="file" accept="image/*" multiple hidden onchange="addFotos(this)">${ico('imagem')} Galeria</label>
    </div>`;
}
async function addFotos(input) {
  const arquivos = [...input.files];
  input.value = '';
  if (S.form.fotos.length + arquivos.length > 12) { toast('Máximo de 12 fotos por registro.', 4000, 'erro'); return; }
  for (const f of arquivos) {
    try {
      const blob = await comprimirImagem(f);
      S.form.fotos.push({ blob, url: URL.createObjectURL(blob), legenda: '' });
      S.form.sujo = true;
    } catch (e) { toast(e.message, 5000, 'erro'); }
  }
  desenharFotos();
}
function desenharFotos() {
  const el = $('#fotos');
  if (!el) return;
  el.innerHTML = S.form.fotos.map((f, i) => `<figure class="foto" style="margin:0">
      <img src="${esc(f.url || '')}" alt="Foto ${i + 1}" onclick="verFoto('${esc(f.url || '')}', ${i})">
      <button type="button" class="tirar" onclick="tirarFoto(${i})" aria-label="Remover foto">${ico('x')}</button>
      ${S.form.comLegenda ? `<input type="text" placeholder="Legenda da foto ${i + 1}" value="${esc(f.legenda)}" oninput="S.form.fotos[${i}].legenda=this.value">` : ''}
    </figure>`).join('');
}
function tirarFoto(i) {
  if (!confirm('Remover esta foto?')) return;
  S.form.fotos.splice(i, 1); S.form.sujo = true; desenharFotos();
}
function verFoto(url, i, legenda = '') {
  if (!url) return;
  const leg = legenda || S.form?.fotos?.[i]?.legenda || '';
  $('#camada').innerHTML = `<div class="lightbox" onclick="this.remove()"><img src="${esc(url)}" alt=""><p>${esc(leg)}</p><p style="opacity:.7;font-size:13px">Toque para fechar</p></div>`;
}

// ---------- localização
async function usarLocalizacao() {
  const info = $('#gps-info');
  if (!navigator.geolocation) { info.innerHTML = `<div class="gps aviso">Este aparelho não informa a localização. Digite o endereço.</div>`; return; }
  info.innerHTML = `<div class="gps aviso">${ico('pino')} Buscando localização…</div>`;
  navigator.geolocation.getCurrentPosition(async (pos) => {
    const { latitude: lat, longitude: lng, accuracy } = pos.coords;
    S.form.geo = { lat, lng, prec: Math.round(accuracy) };
    S.form.sujo = true;
    mostrarGeo();
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1&accept-language=pt-BR`);
      const j = await r.json();
      const a = j.address || {};
      const rua = [a.road, a.house_number].filter(Boolean).join(', ');
      const bairro = a.suburb || a.neighbourhood || a.quarter || '';
      const cidade = [a.city || a.town || a.village || a.municipality, a['ISO3166-2-lvl4']?.replace('BR-', '')].filter(Boolean).join(' - ');
      const texto = [rua, bairro, cidade].filter(Boolean).join(' – ') || j.display_name || '';
      const campo = $('#f-endereco');
      if (texto && campo) {
        if (!campo.value.trim() || confirm(`Trocar o endereço digitado por:\n\n${texto}`)) campo.value = texto;
      }
    } catch { toast('Localização gravada, mas não consegui descobrir o endereço. Digite-o.', 5000); }
  }, (e) => {
    info.innerHTML = `<div class="gps aviso">${ico('pino')} ${e.code === 1 ? 'Permissão de localização negada. Libere nas configurações do navegador ou digite o endereço.' : 'Não consegui a localização agora. Digite o endereço.'}</div>`;
  }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 30000 });
}
function mostrarGeo() {
  const g = S.form?.geo, info = $('#gps-info');
  if (!info) return;
  info.innerHTML = g ? `<div class="gps">${ico('pino')} Localização registrada (precisão ±${g.prec ?? '?'} m) · <button type="button" class="link" onclick="S.form.geo=null;mostrarGeo()">remover</button></div>` : '';
}

function depoisDeDesenharForm(tipo, r) {
  desenharFotos();
  mostrarGeo();
  if (tipo === 'ocorrencia') atualizarOcorrencia();
  if (tipo === 'dds') { const s = $('#f-tema'); if (s) $('#f-tema-outro-c').hidden = s.value !== '__outro'; }
}

// ---------- coletar + validar
function coletarForm() {
  const f = $('#form');
  const v = (n) => (f.querySelector(`[name="${n}"]`)?.value || '').trim();
  const marcado = (n) => f.querySelector(`[name="${n}"]:checked`)?.value || '';
  const marcados = (n) => $$(`[name="${n}"]:checked`, f).map((x) => x.value);
  const erros = [];
  const exigir = (cond, msg, el) => { if (!cond) { erros.push(msg); el?.classList.add('erro-campo'); } };
  $$('.erro-campo', f).forEach((e) => e.classList.remove('erro-campo'));

  const tipo = S.form.tipo;
  const base = {
    tipo, obra: v('obra'), endereco: v('endereco'),
    latitude: S.form.geo?.lat ?? null, longitude: S.form.geo?.lng ?? null, precisao_m: S.form.geo?.prec ?? null,
  };
  exigir(base.obra, 'Informe a obra / local.', $('#f-obra'));
  if (tipo !== 'dds') exigir(base.endereco, 'Informe o endereço.', $('#f-endereco'));
  let dados = {};

  if (tipo === 'dds') {
    const tema = v('tema') === '__outro' ? v('tema_outro') : v('tema');
    dados = { tema, participantes: v('participantes'), observacoes: v('observacoes') };
    exigir(tema, 'Informe o assunto abordado.', $('#f-tema'));
    exigir(S.form.fotos.length > 0, 'Adicione pelo menos uma foto do DDS.', $('#fotos'));
  }

  if (tipo === 'visita') {
    const lerDesvio = (el) => Object.fromEntries($$('[data-k]', el).map((x) => [x.dataset.k, x.value.trim()]));
    const checklist = $$('.chk', f).map((el) => {
      const item = { descricao: el.dataset.desc, tipo: el.dataset.tipo, status: el.dataset.s || '' };
      if (!item.status) { el.classList.add('erro-campo'); }
      if (item.status === 'NC') {
        Object.assign(item, lerDesvio($('.nc-box', el)));
        if (!item.desvio) $('.nc-box textarea', el).classList.add('erro-campo');
      }
      return item;
    });
    const desvios = $$('#desvios .desvio', f).map(lerDesvio).filter((x) => x.desvio || x.acao);
    const servicos = [...marcados('servicos'), ...v('servico_outro').split(',').map((s) => s.trim()).filter(Boolean)];
    dados = { empresa: v('empresa'), encarregado: v('encarregado'), servicos, trabalhadores: v('trabalhadores'), checklist, desvios, observacoes: v('observacoes') };
    exigir(servicos.length, 'Marque qual é o serviço.', null);
    exigir(checklist.every((c) => c.status), 'Responda todos os itens do checklist (C, NC ou NA).', null);
    exigir(checklist.every((c) => c.status !== 'NC' || c.desvio), 'Descreva o que foi observado em cada item NC.', null);
  }

  if (tipo === 'ocorrencia') {
    const classificacao = marcado('classificacao');
    const lesao = !!CLASSIF[classificacao]?.lesao;
    dados = {
      classificacao, momento: marcado('momento'),
      tipo_acidente: lesao ? marcado('tipo_acidente') : '',
      acidentado: lesao ? { nome: v('ac_nome'), funcao: v('ac_funcao'), vinculo: marcado('ac_vinculo') } : null,
      partes_corpo: lesao ? marcados('partes_corpo') : [],
      natureza: lesao ? marcado('natureza') : '',
      atendimento: lesao ? marcado('atendimento') : '',
      dano_material: classificacao === 'sem_lesao' ? v('dano_material') : '',
      descricao: v('descricao'), causa: v('causa'), acoes_imediatas: v('acoes_imediatas'), testemunhas: v('testemunhas'),
    };
    exigir(classificacao, 'Escolha o que aconteceu (tipo de ocorrência).', null);
    exigir(dados.momento, 'Informe quando aconteceu.', null);
    if (lesao) exigir(dados.acidentado.nome, 'Informe o nome do acidentado.', $('#f-acn'));
    exigir(dados.descricao, 'Descreva o ocorrido.', $('#f-desc'));
  }
  return { base, dados, erros };
}

async function subirFotosPendentes(btn) {
  const pend = S.form.fotos.filter((f) => !f.path);
  let n = 0;
  for (const f of S.form.fotos) {
    if (f.path) continue;
    n++;
    btn.innerHTML = `Enviando foto ${n} de ${pend.length}…`;
    f.path = await api.enviarFoto(f.blob, S.perfil.id);
  }
  return S.form.fotos.map((f) => ({ path: f.path, legenda: (f.legenda || '').trim() }));
}

async function enviarForm(ev) {
  ev.preventDefault();
  const { base, dados, erros } = coletarForm();
  if (erros.length) {
    toast(erros[0], 5000, 'erro');
    ($('.erro-campo') || $('#form')).scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  const btn = $('#btn-enviar'); const txt = btn.innerHTML;
  btn.disabled = true;
  try {
    const fotos = await subirFotosPendentes(btn);
    btn.innerHTML = 'Enviando registro…';
    const res = await api.registrar({ ...base, dados, fotos });
    guardarEnviado({ tipo: base.tipo, numero: res.numero, obra: base.obra });
    const tipo = base.tipo, lesao = !!CLASSIF[dados.classificacao]?.lesao;
    S.form = null;
    ir('sucesso', { tipo, numero: res.numero, lesao }, true);
  } catch (e) {
    toast('Não foi enviado: ' + traduzErro(e) + ' Seus dados continuam aqui — tente de novo.', 8000, 'erro');
    btn.disabled = false; btn.innerHTML = txt;
  }
}

function telaSucesso({ tipo, numero, lesao }) {
  app().innerHTML = `${topo({ titulo: 'Vistoria QSMS', sub: S.perfil.nome })}
  <main class="pagina"><div class="sucesso">
    <div class="bolha">${ico('ok')}</div>
    <h1>Registro enviado!</h1>
    <p>${esc(TIPOS[tipo]?.nome)}</p>
    <div class="numero">nº ${esc(numero)}</div>
    <p>A engenheira de segurança já recebeu.</p>
    ${lesao ? `<div class="alerta vermelho" style="text-align:left">${ico('ocorrencia')}<span>Acidente com lesão: <b>avise a engenheira também por telefone</b> para a emissão da CAT.</span></div>` : ''}
    <button class="btn bloco" style="margin-top:18px" onclick="ir('tecnico',{},true)">Voltar ao início</button>
  </div></main>`;
}

function trocarAba(k) { S.admin.aba = k; ir('admin', { aba: k }, true); }

const ehLesao = (r) => r.tipo === 'ocorrencia' && CLASSIF[r.dados?.classificacao]?.lesao;
const ncsDe = (r) => r.tipo === 'visita' ? (r.dados?.checklist || []).filter((c) => c.status === 'NC').length + (r.dados?.desvios || []).length : 0;
function resumoReg(r) {
  if (r.tipo === 'dds') return r.dados?.tema || '';
  if (r.tipo === 'visita') return (r.dados?.servicos || []).join(', ');
  return CLASSIF[r.dados?.classificacao]?.nome || '';
}

function filtrarRegistros() {
  const f = S.admin.filtros;
  const limite = f.periodo ? Date.now() - Number(f.periodo) * 864e5 : 0;
  const busca = f.busca.toLowerCase();
  return S.admin.registros.filter((r) =>
    (f.lixeira ? r.excluido_em : !r.excluido_em)
    && (!f.tipo || r.tipo === f.tipo)
    && (!f.tecnico || r.autor_id === f.tecnico)
    && (!f.status || r.status === f.status)
    && (!limite || new Date(r.criado_em).getTime() >= limite)
    && (!busca || `${r.numero} ${r.obra} ${r.endereco} ${r.autor_nome} ${resumoReg(r)}`.toLowerCase().includes(busca)));
}

function desenharRegistros() {
  const todos = S.admin.registros.filter((r) => !r.excluido_em);
  const mes = todos.filter((r) => Date.now() - new Date(r.criado_em) < 30 * 864e5);
  const urgentes = todos.filter((r) => ehLesao(r) && r.status !== 'concluido');
  const tecnicos = [...new Map(S.admin.registros.map((r) => [r.autor_id, r.autor_nome])).entries()];
  const f = S.admin.filtros;
  $('#aba').innerHTML = `
    ${urgentes.map((r) => `<div class="alerta vermelho" style="cursor:pointer" onclick="ir('registro',{id:'${r.id}'})">${ico('ocorrencia')}
      <span><b>${esc(CLASSIF[r.dados.classificacao].nome)}</b> — ${esc(r.obra)} · ${esc(r.autor_nome)} · ${fmtDataHora(r.criado_em)}<br>
      ${r.dados.classificacao === 'fatal' ? '<b>Óbito: comunicação imediata à Previdência e à autoridade policial.</b>' : `CAT até <b>${prazoCAT(r.criado_em)}</b> (1º dia útil seguinte). Toque para abrir.`}</span></div>`).join('')}
    <div class="kpis">
      <div class="kpi"><small>Novos (não abertos)</small><b>${todos.filter((r) => r.status === 'novo').length}</b></div>
      <div class="kpi"><small>DDS · 30 dias</small><b>${mes.filter((r) => r.tipo === 'dds').length}</b></div>
      <div class="kpi"><small>Visitas · 30 dias</small><b>${mes.filter((r) => r.tipo === 'visita').length}</b></div>
      <div class="kpi"><small>Não conformidades · 30 dias</small><b>${mes.reduce((s, r) => s + ncsDe(r), 0)}</b></div>
      <div class="kpi ${mes.some((r) => r.tipo === 'ocorrencia') ? 'vermelho' : ''}"><small>Ocorrências · 30 dias</small><b>${mes.filter((r) => r.tipo === 'ocorrencia').length}</b></div>
    </div>
    <div class="card">
      <div class="filtros">
        <input type="search" placeholder="Buscar obra, endereço, nº, técnico…" value="${esc(f.busca)}" oninput="S.admin.filtros.busca=this.value;desenharListaReg()">
        <select onchange="S.admin.filtros.tecnico=this.value;desenharListaReg()"><option value="">Todos os técnicos</option>
          ${tecnicos.map(([id, n]) => `<option value="${esc(id)}" ${f.tecnico === id ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>
        <select onchange="S.admin.filtros.periodo=this.value;desenharListaReg()">
          ${[['7', 'Últimos 7 dias'], ['30', 'Últimos 30 dias'], ['90', 'Últimos 90 dias'], ['365', 'Último ano'], ['', 'Todo o período']].map(([v, n]) => `<option value="${v}" ${f.periodo === v ? 'selected' : ''}>${n}</option>`).join('')}</select>
        <select onchange="S.admin.filtros.status=this.value;desenharListaReg()"><option value="">Todos os status</option>
          ${Object.entries(STATUS).map(([k, n]) => `<option value="${k}" ${f.status === k ? 'selected' : ''}>${n}</option>`).join('')}</select>
      </div>
      <div class="filtros-tipo">
        <div class="chips">${[['', 'Todos'], ['dds', 'DDS'], ['visita', 'Visitas'], ['ocorrencia', 'Ocorrências']].map(([k, n]) => `<label class="chip"><input type="radio" name="ft" ${f.tipo === k ? 'checked' : ''} onchange="S.admin.filtros.tipo='${k}';desenharListaReg()"><span>${n}</span></label>`).join('')}</div>
        <label style="display:flex;gap:6px;align-items:center;font-size:14px;color:var(--suave);margin-left:auto"><input type="checkbox" ${f.lixeira ? 'checked' : ''} onchange="S.admin.filtros.lixeira=this.checked;desenharListaReg()"> Lixeira</label>
        <button class="btn sec peq" onclick="exportarCSV()">${ico('baixar')} Planilha</button>
        <button class="btn sec peq" onclick="ir('admin',{aba:'registros'},true)">${ico('atualizar')} Atualizar</button>
      </div>
    </div>
    <div id="lista-reg" class="lista-reg"></div>`;
  desenharListaReg();
}

function desenharListaReg() {
  const lista = filtrarRegistros();
  $('#lista-reg').innerHTML = lista.length ? lista.map((r) => {
    const T = TIPOS[r.tipo];
    const c = CLASSIF[r.dados?.classificacao];
    const nc = ncsDe(r);
    return `<button class="reg" style="--cor:${c ? c.cor : T.cor};--cor-bg:${c ? c.bg : T.bg}" onclick="ir('registro',{id:'${r.id}'})">
      <span class="bolha">${ico(r.tipo)}</span>
      <span class="meio"><b>${esc(T.nome)} nº ${r.numero} · ${esc(r.obra)}</b>
        <small>${esc(resumoReg(r))}</small>
        <small>${esc(r.autor_nome)}${r.endereco ? ' · ' + esc(r.endereco) : ''}</small></span>
      <span class="lado">${fmtData(r.criado_em)}<br><b>${fmtHora(r.criado_em)}</b><br>
        ${nc ? `<span class="selo vermelho">${nc} NC</span> ` : ''}<span class="selo ${r.status}">${STATUS[r.status]}</span></span>
    </button>`;
  }).join('') : `<div class="vazio">Nenhum registro com esses filtros.</div>`;
}

function exportarCSV() {
  const linhas = filtrarRegistros();
  const cab = ['Nº', 'Tipo', 'Data', 'Hora', 'Técnico', 'Obra', 'Endereço', 'Latitude', 'Longitude', 'Resumo', 'NCs', 'Status', 'Parecer'];
  const q = (s) => `"${String(s ?? '').replace(/"/g, '""')}"`;
  const csv = [cab, ...linhas.map((r) => [r.numero, TIPOS[r.tipo].nome, fmtData(r.criado_em), fmtHora(r.criado_em), r.autor_nome, r.obra, r.endereco,
    r.latitude ?? '', r.longitude ?? '', resumoReg(r), ncsDe(r), STATUS[r.status], r.parecer])].map((l) => l.map(q).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `vistorias-qsms-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
}

async function salvarAnalise(id, btn) {
  btn.disabled = true;
  try {
    const r = await api.atualizarRegistro(id, { status: $('#d-status').value, parecer: $('#d-parecer').value.trim() });
    substituirReg(r);
    toast('Análise salva.', 2500, 'ok');
    ir('registro', { id }, true);
  } catch (e) { toast(traduzErro(e), 6000, 'erro'); btn.disabled = false; }
}
async function lixeira(id, enviar) {
  if (enviar && !confirm('Enviar este registro para a lixeira? Ele pode ser restaurado depois (Registros → Lixeira).')) return;
  try {
    const r = await api.atualizarRegistro(id, { excluido_em: enviar ? new Date().toISOString() : null });
    substituirReg(r);
    toast(enviar ? 'Enviado para a lixeira.' : 'Registro restaurado.', 3000, 'ok');
    ir('registro', { id }, true);
  } catch (e) { toast(traduzErro(e), 6000, 'erro'); }
}
async function imprimir() {
  // espera as fotos carregarem antes de abrir a impressão
  await Promise.all($$('#det img').map((i) => i.complete ? null : new Promise((ok) => { i.onload = i.onerror = ok; })));
  window.print();
}

async function telaEditar({ id }) {
  const r = S.admin.registros.find((x) => x.id === id);
  if (!r) { ir('admin', {}, true); return; }
  if (!S.form || S.form.editId !== id) {
    const urls = await api.urlsFotos((r.fotos || []).map((f) => f.path)).catch(() => ({}));
    S.form = { tipo: r.tipo, editId: id, sujo: false,
      geo: r.latitude != null ? { lat: r.latitude, lng: r.longitude, prec: r.precisao_m } : null,
      fotos: (r.fotos || []).map((f) => ({ path: f.path, legenda: f.legenda || '', url: urls[f.path] || '' })) };
  }
  app().innerHTML = `${topo({ titulo: `Editar ${TIPOS[r.tipo].nome} nº ${r.numero}`, sub: 'A versão anterior fica guardada no histórico', voltarBtn: true })}
  <main class="pagina">
    <form id="form" novalidate onsubmit="salvarEdicao(event)" oninput="S.form.sujo=true" onchange="S.form.sujo=true">
      ${corpoForm(r.tipo, r)}
      <div class="alerta amarelo">${ico('lapis')}<span>Data, hora e autor do envio não podem ser alterados.</span></div>
      <button class="btn bloco" id="btn-enviar">Salvar alterações</button>
    </form>
  </main>`;
  depoisDeDesenharForm(r.tipo, r);
}
async function salvarEdicao(ev) {
  ev.preventDefault();
  const { base, dados, erros } = coletarForm();
  if (erros.length && !confirm(`Atenção: ${erros[0]}\n\nSalvar mesmo assim?`)) return;
  const btn = $('#btn-enviar'); btn.disabled = true;
  try {
    const fotos = await subirFotosPendentes(btn);
    const { tipo, ...campos } = base;
    const r = await api.atualizarRegistro(S.form.editId, { ...campos, dados, fotos });
    substituirReg(r);
    S.form = null;
    toast('Alterações salvas.', 2500, 'ok');
    history.back();
  } catch (e) { toast(traduzErro(e), 7000, 'erro'); btn.disabled = false; btn.textContent = 'Salvar alterações'; }
}

function senhaSugerida() {
  const p = ['Obra', 'Capacete', 'Seguro', 'Axial', 'Canteiro', 'Prumo'];
  return p[Math.floor(Math.random() * p.length)] + '@' + String(Math.floor(1000 + Math.random() * 9000));
}
async function salvarUsuario(ev, id) {
  ev.preventDefault();
  const corpo = id
    ? { acao: 'editar', id, nome: $('#u-nome').value.trim(), funcao: $('#u-funcao').value.trim(), registro: $('#u-registro').value.trim(), papel: $('#u-papel').value }
    : { acao: 'criar', nome: $('#u-nome').value.trim(), login: $('#u-login').value.trim(), senha: $('#u-senha').value, funcao: $('#u-funcao').value.trim(), registro: $('#u-registro').value.trim(), papel: $('#u-papel').value };
  if (!id && /\s/.test(corpo.login)) { toast('O usuário não pode ter espaços.', 4000, 'erro'); return; }
  try {
    await api.gerenciar(corpo);
    fecharModal();
    toast(id ? 'Usuário atualizado.' : `Usuário criado. Login: ${loginCurto(paraLogin(corpo.login))} · Senha: ${corpo.senha}`, id ? 3000 : 12000, 'ok');
    S.admin.usuarios = await api.usuarios(); desenharUsuarios();
  } catch (e) { toast(traduzErro(e), 6000, 'erro'); }
}
async function trocarSenhaUsuario(id) {
  const s = prompt('Nova senha (mínimo 8 caracteres):', senhaSugerida());
  if (!s) return;
  try { await api.gerenciar({ acao: 'senha', id, senha: s }); toast('Senha redefinida: ' + s, 10000, 'ok'); }
  catch (e) { toast(traduzErro(e), 6000, 'erro'); }
}
async function acaoUsuario(acao, id) {
  if (acao === 'bloquear' && !confirm('Bloquear este usuário? Ele não consegue mais entrar. Os registros dele continuam guardados.')) return;
  try {
    await api.gerenciar({ acao, id });
    fecharModal();
    toast(acao === 'bloquear' ? 'Acesso bloqueado.' : 'Acesso reativado.', 3000, 'ok');
    S.admin.usuarios = await api.usuarios(); desenharUsuarios();
  } catch (e) { toast(traduzErro(e), 6000, 'erro'); }
}

  ev.preventDefault();
  const f = ev.target;
  const valor = f.valor.value.trim();
  if (!valor) return;
  const lista = tabela === 'checklist_itens' ? S.listas.checklist : opcoesDe(tipo, false);
  const linha = { [campo]: valor, ordem: Math.max(0, ...lista.map((x) => x.ordem || 0)) + 1 };
  if (tabela === 'opcoes') linha.tipo = tipo;
  if (tabela === 'checklist_itens') linha.tipo = f.tipo.value;
  try { await api.salvarLinha(tabela, linha); await carregarListas(); desenharListas(); }
  catch (e) { toast(/duplicate|unique/i.test(e.message) ? 'Esse item já existe.' : traduzErro(e), 6000, 'erro'); }
}

// ============================================================
//  PARTIDA
// ============================================================
async function partida() {
  if (!DEMO && !window.supabase) {
    app().innerHTML = `<div class="inicio"><img class="logo" src="logo.png" alt="Construtora Axial"><div class="alerta vermelho" style="max-width:420px">${ico('ocorrencia')}<span>Não consegui abrir o app (sem internet?). Confira a conexão e toque em <b>Tentar de novo</b>.</span></div><button class="btn" onclick="location.reload()">Tentar de novo</button></div>`;
    return;
  }
  if (!DEMO) SB.iniciar(); else Demo.iniciar();
  try {
    S.perfil = await api.perfilAtual();
    if (S.perfil && !S.perfil.ativo) { await api.sair(); S.perfil = null; }
    if (S.perfil) await carregarListas();
  } catch (e) { S.perfil = null; toast(traduzErro(e), 6000, 'erro'); }

  if (!DEMO) {
    SB.db.auth.onAuthStateChange((evento) => {
      if (evento === 'PASSWORD_RECOVERY') pedirNovaSenha();
      if (evento === 'SIGNED_OUT' && S.perfil) { S.perfil = null; desenhar({ tela: 'inicio', params: {} }); }
    });
  }
  const inicial = { tela: telaInicial(), params: {} };
  history.replaceState(inicial, '');
  pilha = [inicial];
  desenhar(inicial);
}
function pedirNovaSenha() {
  $('#camada').innerHTML = `<div class="fundo-modal"><div class="modal"><h2>Criar nova senha</h2>
    <form onsubmit="event.preventDefault();salvarNovaSenha()"><div class="campo"><label>Nova senha (mín. 8)</label><input type="password" id="ns" minlength="8" required></div>
    <button class="btn bloco">Salvar senha</button></form></div></div>`;
}
async function salvarNovaSenha() {
  try { await api.novaSenha($('#ns').value); fecharModal(); toast('Senha alterada.', 3000, 'ok'); }
  catch (e) { toast(traduzErro(e), 6000, 'erro'); }
}

// Service worker: instala no celular e avisa quando há versão nova.
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').then((reg) => {
    const avisar = (w) => toast('Nova versão do app disponível.', 0, '', { texto: 'Atualizar', acao: () => w.postMessage('SKIP_WAITING') });
    if (reg.waiting && navigator.serviceWorker.controller) avisar(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      w?.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) avisar(w); });
    });
  });
  let recarregou = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!recarregou) { recarregou = true; location.reload(); } });
}

partida();
</script>
